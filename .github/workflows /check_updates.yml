name: Rust Plugin Updates Checker

on:
  push:
    paths:
      - 'plugins_list.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check_updates:
    runs-on: ubuntu-latest
    
    # Añadimos esta variable para silenciar el aviso y usar Node 24
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5  # Actualizado de v4 a v5

      - name: Setup Python
        uses: actions/setup-python@v5  # Actualizado de v4 a v5
        with:
          python-version: 3.11

      - name: Install requirements
        run: |
          pip install requests beautifulsoup4 packaging

      - name: Run update checker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python check_updates_final.py

      - name: Commit versions.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add versions.json
          # [skip ci] evita bucles infinitos de ejecución
          git commit -m "Update plugin versions [skip ci]" || echo "No changes"
          git push
